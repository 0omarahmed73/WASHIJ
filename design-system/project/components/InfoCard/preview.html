<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Readex+Pro:wght@300..700&family=Scheherazade+New:wght@400;700&display=swap"><style>:root,[data-theme="gallery"]{--midnight:#081b33;--deep-blue:#0e2542;--night-raised:#14305a;--indigo:#1e3a8a;--cobalt:#2563eb;--muted-sky:#7da3d8;--mist:#9fb3cf;--star-yellow:#f2c94c;--ivory:#f6f2e9;--madder-light:#e8907a;--bg:#081b33;--surface:#0e2542;--surface-raised:#14305a;--surface-selected:#1e3a8a;--on-selected:#f6f2e9;--ink:#f6f2e9;--ink-muted:#9fb3cf;--hairline:#1f3a5f;--border-control:#5e7ca6;--accent:#7da3d8;--interactive:#2563eb;--on-interactive:#f6f2e9;--accent-fill:#f2c94c;--on-accent:#081b33;--thread:#f2c94c;--focus:#f2c94c;--danger:#e8907a;--shadow-hang:0 28px 48px -28px rgba(0,5,20,0.8);}:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;--radius-none:0;--radius-sm:2px;--radius-round:9999px;--font-display:"Cormorant Garamond", "Aref Ruqaa", Georgia, serif;--font-arabic:"Aref Ruqaa", "Scheherazade New", Georgia, serif;--font-text:"Scheherazade New", "Aref Ruqaa", Georgia, serif;--font-wordmark:"Amiri", Georgia, serif;--font-ui:"Readex Pro", system-ui, -apple-system, "Segoe UI", sans-serif;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-text);line-height:1.7;-webkit-font-smoothing:antialiased}
.ui{font-family:var(--font-ui)}.en{font-family:var(--font-display);direction:ltr}
.cap{font-family:var(--font-ui);font-size:12px;line-height:1.6;color:var(--ink-muted)}
.eb{font-family:var(--font-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);direction:ltr}
.lab{font-family:var(--font-ui);font-size:13px;font-weight:500;color:var(--ink-muted)}
.pad{padding:32px}
.tile{background:var(--surface);border:1px solid var(--hairline);display:flex;flex-direction:column}
.tile .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px;min-height:150px}
.tile .meta{padding:14px 16px;border-top:1px solid var(--hairline)}
.tile .meta b{display:block;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink)}
.tile .meta span{display:block;font-family:var(--font-ui);font-size:12px;color:var(--ink-muted);line-height:1.6;margin-top:2px}
.on-dark{--bg:#081b33;--surface:#0e2542;--surface-raised:#14305a;--ink:#f6f2e9;--ink-muted:#9fb3cf;--hairline:#1f3a5f;--accent:#7da3d8;--thread:#f2c94c;--accent-fill:#f2c94c;--on-accent:#081b33;background:var(--bg);color:var(--ink)}
.btn{font-family:var(--font-ui);font-size:15px;font-weight:500;padding:12px 24px;border:1px solid var(--border-control);background:transparent;color:var(--ink);display:inline-block}
.btn.pri{background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent-fill)}
.arw{font-family:var(--font-wordmark);font-weight:700;line-height:1.35;display:inline-block;white-space:nowrap}.arw .fatha{color:var(--thread)}.arw.plain .fatha{color:inherit}.enw{font-family:var(--font-display);font-weight:500;line-height:1;display:inline-block;direction:ltr;text-transform:uppercase}</style>

iv class="ui" style="font-size:12px;letter-spacing:.14em;color:var(--ink-muted)">FOLLOW THE THREAD →</div><svg class="" width="34" height="34" viewBox="0 0 120 120" role="img" aria-label="WASHIJ"><path d="M33,71.66 V15 H87 V105 H33 V86.34" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="miter" stroke-linecap="butt"/><path d="M6,98 L33,79.00 L79.00,46.63 M95.00,35.37 L114,22" fill="none" stroke="var(--thread)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div></div>

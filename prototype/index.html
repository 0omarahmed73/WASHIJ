<title>وَشيج | WASHIJ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:wght@400;500;600&family=Aref+Ruqaa:wght@400;700&family=Scheherazade+New:wght@400;700&family=Readex+Pro:wght@300..700&display=swap">
<style>/* Design plan: nocturnal museum. Tokens come from the approved WASHIJ system (gallery = default, reading-room = light).
   Layout: RTL editorial pages; paintings sit whole on mats, never filtered; the Long Thread runs in the margin only. */
:root{--bg:#081b33;--surface:#0e2542;--raised:#14305a;--selected:#1e3a8a;--on-selected:#f6f2e9;--ink:#f6f2e9;--muted:#9fb3cf;--hair:#1f3a5f;--ctl:#5e7ca6;--accent:#7da3d8;--cobalt:#2563eb;--on-cobalt:#f6f2e9;--yellow:#f2c94c;--on-yellow:#081b33;--thread:#f2c94c;--focus:#f2c94c;--danger:#e8907a;--shadow:0 28px 48px -28px rgba(0,5,20,.85);
 --f-ar:'Aref Ruqaa','Scheherazade New',Georgia,serif;--f-read:'Scheherazade New','Aref Ruqaa',Georgia,serif;--f-mark:'Amiri',Georgia,serif;--f-ui:'Readex Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--f-en:'Cormorant Garamond','Aref Ruqaa',Georgia,serif;--gut:clamp(16px,4vw,56px);--maxw:1280px;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7;overflow-x:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut);position:relative}
.ar{font-family:var(--f-ar)}.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}.acc{color:var(--accent)}
.eyebrow{font-size:13px;font-weight:500;color:var(--accent)}
h1,h2,h3{font-family:var(--f-ar);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,5.4vw,66px);line-height:1.6}h2{font-size:clamp(28px,3.4vw,40px);line-height:1.6}h3{font-size:24px;line-height:1.6}
p{margin:0}
.read{font-family:var(--f-read);font-size:clamp(18px,1.9vw,21px);line-height:2.05;max-width:62ch}
.read p+p{margin-top:14px}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--hair)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.arw{font-family:var(--f-mark);font-weight:700;font-size:30px;line-height:1.35;white-space:nowrap}.arw i{font-style:normal;color:var(--thread)}
.nav{display:flex;gap:4px;flex:1}
.nav a{padding:8px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:color .15s}
.nav a:hover{color:var(--ink)}.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--thread)}
.tools{display:flex;gap:6px;align-items:center}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid transparent;color:var(--ink)}
.ibtn:hover{border-color:var(--ctl)}
.srch-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--ctl);padding:0 14px;height:42px;min-width:220px;color:var(--muted);font-size:14px}
.menu-btn{display:none}
@media(max-width:860px){.nav,.srch-btn span{display:none}.srch-btn{min-width:0;border-color:transparent;padding:0;width:42px;justify-content:center}.menu-btn{display:grid}.hdr .wrap{gap:12px}}
.drawer{position:fixed;inset:0;z-index:50;background:var(--bg);padding:20px var(--gut);display:none;flex-direction:column;gap:8px;overflow:auto}
.drawer.open{display:flex}.drawer a{font-family:var(--f-ar);font-size:28px;font-weight:700;padding:12px 0;border-bottom:1px solid var(--hair)}
.drawer a[aria-current="page"]{color:var(--accent)}
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) var(--gut) 20px;overflow:auto}
.overlay.open{display:flex}
.s-input{width:100%;max-width:720px;margin-inline:auto;display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--thread);padding:10px 0}
.s-input input{flex:1;background:none;border:0;color:var(--ink);font:500 22px var(--f-ui);outline:none;min-width:0}
.s-res{max-width:720px;margin:20px auto 0;width:100%;display:grid;gap:0}
.s-res a{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.s-res img{width:44px;height:44px;object-fit:contain;background:var(--surface)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 24px;border:1px solid var(--ctl);font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--cobalt);color:var(--on-cobalt);border-color:var(--cobalt)}
.tl{color:var(--accent);font-weight:500;border-bottom:1px solid transparent}.tl:hover{border-bottom-color:currentColor}
/* main */
main{min-height:70vh;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
section{padding-block:clamp(40px,6vw,88px)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.thread-sep{display:block;width:100%;height:22px;color:var(--thread)}
/* plates */
.mat{background:var(--surface);display:grid;place-items:center;position:relative;overflow:hidden}
.mat img{width:auto;height:auto;max-width:84%;max-height:84%;box-shadow:var(--shadow);opacity:0;transition:opacity .35s}
.mat img.ld{opacity:1}
.mat.noimg{color:var(--muted);text-align:center;padding:16px;font-size:13px}
.mat.noimg b{display:block;font-family:var(--f-ar);font-size:19px;color:var(--ink)}
/* hero */
.hero{padding-block:clamp(28px,4vw,56px) clamp(36px,5vw,72px)}
.hero-g{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,64px);align-items:center}
.hero .mat{aspect-ratio:4/3;width:100%}
.hero .mat img{max-width:88%;max-height:88%}
.pager{display:flex;gap:10px;align-items:center;margin-top:28px}
.pager button{width:44px;height:44px;border:1px solid var(--ctl);display:grid;place-items:center;color:var(--muted);font-weight:500}
.pager button[aria-pressed="true"]{background:var(--selected);color:var(--on-selected);border-color:var(--selected)}
.cap{font-size:13px;color:var(--muted);line-height:1.8}
@media(max-width:860px){.hero-g{grid-template-columns:1fr}.hero .mat{order:-1}}
/* collection grid on home */
.curated{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.curated .big{grid-column:span 6;grid-row:span 2}.curated .sm{grid-column:span 3}
.curated .big .mat{aspect-ratio:1/1.02}.curated .sm .mat{aspect-ratio:4/5}
@media(max-width:900px){.curated .big{grid-column:span 12;grid-row:auto}.curated .sm{grid-column:span 6}}
.wcard{display:block}.wcard .mat{aspect-ratio:4/5;transition:background .2s}.wcard:hover .mat{background:var(--raised)}
.wcard h3{margin-top:12px;font-size:22px}.wcard .m{font-size:13px;color:var(--muted)}
/* spotlight */
.spot{background:var(--surface);border-block:1px solid var(--hair)}
.spot-g{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,64px);align-items:center}
.spot .mat{background:var(--bg);aspect-ratio:3/2}
.ctx{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--hair)}
.ctx li{padding:12px 0;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:84px 1fr;gap:14px;font-size:14px}
.ctx b{color:var(--accent);font-weight:500}
@media(max-width:860px){.spot-g{grid-template-columns:1fr}}
/* artists */
.artists{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.acard .mat{aspect-ratio:1/1}.acard h3{margin-top:12px}
@media(max-width:900px){.artists{grid-template-columns:repeat(2,1fr)}}
.mv-list{border-top:1px solid var(--hair)}
.mv-row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr) auto;gap:16px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--hair);transition:padding .2s,background .2s}
.mv-row:hover{background:var(--surface);padding-inline:16px}
.mv-row h3{font-size:clamp(22px,2.6vw,30px)}
@media(max-width:700px){.mv-row{grid-template-columns:1fr auto}.mv-row .p{grid-column:1;order:3}}
/* discovery */
.threads{display:grid;gap:0}
.trow{display:grid;grid-template-columns:130px minmax(0,1fr) 130px;gap:20px;align-items:center;padding:22px 0;border-bottom:1px solid var(--hair)}
.trow .mat{aspect-ratio:1/1}.trow .mat img{max-width:80%;max-height:80%}
.trow .why{text-align:center;position:relative;padding:0 8px}
.trow .why::before{content:"";position:absolute;inset-inline:0;top:50%;height:1.5px;background:var(--thread);opacity:.9;z-index:0}
.trow .why span{position:relative;z-index:1;background:var(--bg);padding:6px 14px;display:inline-block;font-size:14px;max-width:100%}
@media(max-width:700px){.trow{grid-template-columns:76px minmax(0,1fr) 76px;gap:10px}.trow .why span{font-size:12px;padding:4px 8px}}
/* collection page */
.page-h{padding-block:clamp(32px,5vw,64px) 24px;border-bottom:1px solid var(--hair)}
.coll{display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(20px,3vw,48px);padding-block:32px 72px}
.flt{display:grid;gap:18px;align-content:start;position:sticky;top:90px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;height:44px;background:var(--surface);color:var(--ink);border:1px solid var(--ctl);padding:0 12px;font:500 15px var(--f-ui);border-radius:0;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-size:6px 6px;background-repeat:no-repeat;background-position:14px 19px,20px 19px;padding-inline-start:36px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;min-height:0}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--selected);color:var(--on-selected);padding:5px 12px;font-size:13px}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px}
@media(max-width:1080px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.coll{grid-template-columns:1fr}.flt{position:static;grid-template-columns:1fr 1fr}.flt .fld.full{grid-column:1/-1}}
@media(max-width:480px){.grid{gap:22px 14px}.flt{grid-template-columns:1fr}}
.empty{border:1px dashed var(--ctl);padding:48px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:26px}
.fbtn{display:none}
@media(max-width:860px){.fbtn{display:inline-flex}.flt.collapsed{display:none}}
/* detail */
.crumbs{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding-block:18px;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.detail{position:relative}
.d-hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:clamp(24px,4vw,64px);align-items:start;padding-bottom:40px}
.plate{margin:0;position:relative}
.plate .mat{min-height:340px;padding:clamp(14px,3vw,40px)}
.plate .mat img{max-width:100%;max-height:min(78vh,900px);cursor:zoom-in}
.zoom{position:absolute;inset-block-start:10px;inset-inline-start:10px;background:var(--bg);border:1px solid var(--ctl);width:42px;height:42px;display:grid;place-items:center;z-index:2}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;padding:20px 0;border-block:1px solid var(--hair);margin:22px 0}
.facts dt{font-size:13px;color:var(--muted)}.facts dd{margin:0;font-weight:500}
.facts div.w{grid-column:1/-1}
@media(max-width:980px){.d-hero{grid-template-columns:1fr}.plate{order:-1}}
.subnav{position:sticky;top:68px;z-index:10;background:var(--bg);border-block:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.subnav .wrap{display:flex;gap:2px;white-space:nowrap}
.subnav a{padding:14px 18px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.subnav a.on{color:var(--ink);border-bottom-color:var(--thread)}
.dsec{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,8fr);gap:clamp(20px,4vw,64px);padding-block:clamp(36px,5vw,64px);border-bottom:1px solid var(--hair);scroll-margin-top:130px}
@media(max-width:860px){.dsec{grid-template-columns:1fr;gap:14px}}
.dts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media(max-width:900px){.dts{grid-template-columns:1fr}}
.crop{width:100%;background-repeat:no-repeat;background-color:var(--surface);border:1px solid var(--hair)}
.dts h3{margin:12px 0 4px;font-size:20px}.dts p{font-size:14px;color:var(--muted);line-height:1.9}
.interp{display:grid;gap:14px;max-width:760px}
.intp{background:var(--surface);border:1px solid var(--hair);padding:20px 22px}
.intp p{font-family:var(--f-read);font-size:20px;line-height:1.95}
.intp .a{margin-top:8px;font-size:13px;color:var(--accent)}
.note{font-size:13px;color:var(--muted);border-inline-start:2px solid var(--ctl);padding-inline-start:12px;margin-top:6px}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--muted)}.srcs a{color:var(--accent);border-bottom:1px solid transparent}.srcs a:hover{border-bottom-color:currentColor}
.rel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.rel .why{font-size:13px;color:var(--accent);margin-top:4px;line-height:1.8}
@media(max-width:860px){.rel{grid-template-columns:1fr 1fr}}@media(max-width:520px){.rel{grid-template-columns:1fr}}
.rail{position:absolute;inset-block:0;inset-inline-start:0;width:48px;pointer-events:none;display:none}
@media(min-width:1180px){.rail{display:block}.detail .wrap{padding-inline-start:calc(var(--gut) + 28px)}}
.rail path{fill:none;stroke:var(--thread);stroke-width:1.5;stroke-linecap:round}
.rail circle{fill:var(--bg);stroke:var(--thread);stroke-width:1.5}
.lb{position:fixed;inset:0;z-index:70;background:rgba(3,10,22,.96);display:none;place-items:center;padding:16px;cursor:zoom-out}
.lb.open{display:grid}.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;inset-block-start:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:12px;width:44px;height:44px;border:1px solid var(--ctl);color:#f6f2e9;background:#081b33;display:grid;place-items:center}
/* artist / movement */
.p-hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,4vw,64px);align-items:end;padding-block:clamp(32px,5vw,64px)}
.p-hero .mat{aspect-ratio:4/5;max-width:360px;width:100%}
@media(max-width:860px){.p-hero{grid-template-columns:1fr}.p-hero .mat{max-width:260px}}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tag{border:1px solid var(--ctl);padding:5px 14px;font-size:14px}.tag:hover{border-color:var(--ink)}
.traits{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--hair);max-width:640px}
.traits li{padding:14px 0;border-bottom:1px solid var(--hair);font-family:var(--f-read);font-size:20px;display:flex;gap:14px}
.traits li::before{content:"";width:8px;height:1.5px;background:var(--thread);margin-top:.95em;flex:none}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.alist a{border:1px solid var(--hair);padding:16px;display:grid;gap:2px;transition:background .15s}.alist a:hover{background:var(--surface)}
/* footer */
.ftr{border-top:1px solid var(--hair);padding-block:40px 56px;margin-top:40px}
.ftr-g{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,4fr);gap:32px}
.ftr a:hover{color:var(--ink)}.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
@media(max-width:760px){.ftr-g{grid-template-columns:1fr}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.hero-g>*,.spot-g>*,.d-hero>*,.p-hero>*,.dsec>*,.coll>*,.ftr-g>*,.trow>*,.curated>*{min-width:0}
.read{max-width:min(62ch,100%);overflow-wrap:anywhere}
.crop{margin-inline:0}

/* poetic layer */
.poem{font-family:var(--f-ar);font-size:clamp(26px,3vw,36px);line-height:1.8;color:var(--ink);display:flex;gap:16px;align-items:flex-start;margin-top:18px;max-width:30ch}
.poem::before{content:"";flex:none;width:26px;height:1.5px;background:var(--thread);margin-top:1.25em}
.poem small{display:block;font:400 12px var(--f-ui);color:var(--muted);margin-top:4px}
.mline{font-family:var(--f-ar);font-size:clamp(26px,3vw,34px);color:var(--accent);margin-top:6px}
.stars{position:relative}
.stars::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,var(--yellow) 0 1.2px,transparent 1.6px),radial-gradient(circle,var(--accent) 0 1px,transparent 1.4px),radial-gradient(circle,var(--ink) 0 .9px,transparent 1.3px);background-size:260px 210px,340px 280px,410px 330px;background-position:12px 30px,150px 90px,70px 170px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 85%);mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.stars>*:not(.rail){position:relative}
.detail.stars::before{inset:0 0 auto 0;height:720px}
.cpoem{font-family:var(--f-ar);font-size:20px;color:var(--accent);margin-top:2px}
.manif{padding-block:clamp(56px,9vw,120px);text-align:center}
.manif p{font-family:var(--f-ar);font-size:clamp(32px,4.8vw,58px);line-height:1.75;max-width:22ch;margin-inline:auto;text-wrap:balance}
.manif p em{font-style:normal;color:var(--yellow)}
.manif .cap{margin-top:18px}
.weave{display:block;width:100%;height:auto;max-height:160px;color:var(--ctl)}
.hero-poem{margin-top:26px;font-family:var(--f-read);font-size:22px;line-height:1.9;color:var(--muted);max-width:34ch}

.sky{background:linear-gradient(to bottom,rgba(8,27,51,.5),rgba(8,27,51,.35) 55%,var(--bg) 100%),var(--sky,none) center/cover no-repeat,var(--bg)}
.manif.sky{background:linear-gradient(rgba(8,27,51,.62),rgba(8,27,51,.62)),var(--sky,none) center/cover no-repeat,var(--bg);border-block:1px solid var(--hair)}
.hero.sky .wrap::before{display:none}
.detail.stars::before{background-image:var(--sky,none);background-size:cover;background-position:center;opacity:.28;-webkit-mask-image:linear-gradient(to bottom,#000,transparent);mask-image:linear-gradient(to bottom,#000,transparent)}
.hero.sky .read,.hero.sky .hero-poem,.hero.sky .eyebrow{text-shadow:0 0 14px #081b33,0 0 5px #081b33;color:#cdd9ec}
.hero.sky .eyebrow{color:#9fc0ee}
.manif.sky p{text-shadow:0 0 18px #081b33}

/* cinematic hero */
.hero{position:relative;min-height:clamp(560px,84vh,740px);display:flex;padding:0;overflow:hidden;border-bottom:1px solid var(--hair)}
#heroIn{display:contents}
.hero-bg{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(to left,rgba(8,27,51,.94) 0,rgba(8,27,51,.82) 30%,rgba(8,27,51,.28) 58%,rgba(8,27,51,0) 78%),linear-gradient(to top,var(--bg) 0,rgba(8,27,51,0) 22%)}
.hero-thread{position:absolute;inset-inline:0;bottom:6px;width:100%;height:110px;pointer-events:none}
.hero-in{position:relative;width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding-block:clamp(40px,7vw,88px) 96px}
.hero-txt{max-width:520px}
.hero-txt .read,.hero-txt .hero-poem,.hero-txt .eyebrow{text-shadow:0 0 14px #081b33,0 0 4px #081b33;color:#d4deee}
.hero-txt .eyebrow{color:#9fc0ee}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero-cap{display:grid;gap:0;font-size:14px;color:#d4deee;text-shadow:0 0 10px #081b33;max-width:46ch}.hero-cap b{font-size:20px;color:var(--ink)}.hero-cap span{color:var(--accent);font-size:13px}
@media(max-width:860px){.hero{display:block;min-height:0;overflow:hidden}.hero-bg{position:relative;inset:auto;height:min(62vw,300px);background-size:cover}.hero-scrim{display:none}.hero-thread{top:min(62vw,300px);bottom:auto;transform:translateY(-70%);height:90px}.hero-in{padding-block:28px 36px}.hero-txt .read,.hero-txt .hero-poem{text-shadow:none}}
/* brackets, chips, rail, tiles */
.brk{position:relative;display:block}
.brk::before,.brk::after{content:"";position:absolute;width:30px;height:30px;border:0 solid var(--thread);pointer-events:none;z-index:3}
.brk::before{left:-8px;top:-8px;border-top-width:1.6px;border-left-width:1.6px}
.brk::after{right:-8px;bottom:-8px;border-bottom-width:1.6px;border-right-width:1.6px}
.achip{display:inline-flex;align-items:center;gap:12px;margin-top:16px;border:1px solid var(--hair);padding:8px 18px 8px 14px;background:var(--surface);transition:border-color .15s}.achip:hover{border-color:var(--ctl)}
.achip .av{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--hair);background:var(--bg)}
.railbtns{display:flex;gap:8px}.railbtns button{width:44px;height:44px;border:1px solid var(--ctl);display:grid;place-items:center;font-size:18px}.railbtns button:hover{background:var(--selected)}
.rail-sc{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px;scrollbar-width:thin}
.rail-sc .wcard{flex:0 0 clamp(170px,21vw,240px);scroll-snap-align:start}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.tile3{display:grid;gap:14px;border:1px solid var(--hair);background:var(--surface);transition:border-color .15s}.tile3:hover{border-color:var(--ctl)}
.tile3 .mat{aspect-ratio:16/9}.tile3>div{padding:0 20px 20px}.tile3 h3{font-size:24px}
@media(max-width:760px){.tiles3{grid-template-columns:1fr}}
.intp{position:relative;padding-inline-start:54px}.intp::before{content:"»";position:absolute;inset-inline-start:16px;top:6px;font:700 44px/1 var(--f-ar);color:var(--thread);opacity:.8}

h1:focus,main:focus{outline:none}

<script>const IMGS={"starry-night": {"w": 1920, "h": 1520, "file": "Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg", "wiki": "https://en.wikipedia.org/wiki/The_Starry_Night"}, "girl-pearl-earring": {"w": 960, "h": 1137, "file": "1665_Girl_with_a_Pearl_Earring.jpg", "wiki": "https://en.wikipedia.org/wiki/Girl_with_a_Pearl_Earring"}, "great-wave": {"w": 1280, "h": 860, "file": "Tsunami_by_hokusai_19th_century.jpg", "wiki": "https://en.wikipedia.org/wiki/The_Great_Wave_off_Kanagawa"}, "mona-lisa": {"w": 960, "h": 1452, "file": "Mona_Lisa.jpg", "wiki": "https://en.wikipedia.org/wiki/Mona_Lisa"}, "birth-of-venus": {"w": 1280, "h": 804, "file": "Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg", "wiki": "https://en.wikipedia.org/wiki/The_Birth_of_Venus_(Botticelli)"}, "impression-sunrise": {"w": 1280, "h": 993, "file": "Monet_-_Impression%2C_Sunrise.jpg", "wiki": "https://en.wikipedia.org/wiki/Impression,_Sunrise"}, "the-scream": {"w": 960, "h": 1191, "file": "Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg", "wiki": "https://en.wikipedia.org/wiki/The_Scream"}, "night-watch": {"w": 1280, "h": 1041, "file": "La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg", "wiki": "https://en.wikipedia.org/wiki/The_Night_Watch"}, "milkmaid": {"w": 960, "h": 1079, "file": "Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "wiki": "https://en.wikipedia.org/wiki/The_Milkmaid_(Vermeer)"}, "wanderer": {"w": 960, "h": 1231, "file": "Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg", "wiki": "https://en.wikipedia.org/wiki/Wanderer_above_the_Sea_of_Fog"}, "las-meninas": {"w": 960, "h": 1105, "file": "Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "wiki": "https://en.wikipedia.org/wiki/Las_Meninas"}, "the-kiss": {"w": 960, "h": 963, "file": "The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg", "wiki": "https://en.wikipedia.org/wiki/The_Kiss_(Klimt)"}, "cafe-terrace": {"w": 960, "h": 1197, "file": "Van_Gogh_-_Terrace_of_a_Caf%C3%A9_at_Night_%28Place_du_Forum%29_1888.jpg", "wiki": "https://en.wikipedia.org/wiki/Caf%C3%A9_Terrace_at_Night"}};const MOVEMENTS={
 renaissance:{line:'عينٌ تتعلم النظر من جديد',ar:'النهضة',orig:'Renaissance',period:'نحو 1400 – 1600',where:'إيطاليا أولًا ثم أوروبا',intro:'حركة فنية وثقافية بدأت في مدن إيطاليا، ورجعت إلى دراسة الإنسان والعالم بعين جديدة، مستندة إلى المنظور والتشريح وملاحظة الطبيعة.',traits:['المنظور الخطي لتمثيل العمق','دراسة التشريح والتناسب','موضوعات دينية وأسطورية وبورتريه','عناية بالتوازن والتكوين']},
 baroque:{line:'ضوءٌ يقتحم المسرح',ar:'الباروك',orig:'Baroque',period:'نحو 1600 – 1750',where:'أوروبا',intro:'فن يقوم على الدراما والحركة وتباين الضوء والظل، ازدهر في الكنيسة والبلاط معًا، وسعى إلى أن يأخذ المشاهد إلى قلب المشهد.',traits:['تباين قوي بين الضوء والعتمة','حركة وانفعال في التكوين','تفاصيل غنية ومساحات كبيرة','رعاة من الكنيسة والبلاط']},
 dutch:{line:'نافذةٌ وضوءٌ وبيتٌ يتأمل نفسه',ar:'العصر الذهبي الهولندي',orig:'Dutch Golden Age',period:'القرن 17',where:'الجمهورية الهولندية',intro:'فن ازدهر مع نمو المدن التجارية الهولندية. كان رعاته من التجار والمؤسسات المدنية لا من الكنيسة والبلاط، فاتجه إلى الحياة اليومية والمناظر والبورتريه الجماعي.',traits:['مشاهد داخلية وحياة يومية','البورتريه الجماعي والفردي','عناية فائقة بالضوء','لوحات تناسب البيوت لا القصور']},
 romanticism:{line:'الطبيعة مرآةُ القلب',ar:'الرومانسية',orig:'Romanticism',period:'أواخر القرن 18 – منتصف القرن 19',where:'أوروبا',intro:'تيار رأى في الطبيعة والمشاعر والخيال مصدرًا للفن، وقدّم الفرد وتجربته الداخلية على القواعد الأكاديمية الصارمة.',traits:['الطبيعة المهيبة والأفق الواسع','الانفعال والخيال','فردية الفنان','حضور الشعر والتاريخ والأساطير']},
 impressionism:{line:'اللحظة قبل أن تمضي',ar:'الانطباعية',orig:'Impressionism',period:'ستينيات – ثمانينيات القرن 19',where:'فرنسا',intro:'خرج فنانوها من المرسم إلى الهواء الطلق ليلتقطوا أثر الضوء العابر على المشهد. وجاء اسمها من عنوان لوحة مونيه «انطباع، شروق الشمس»، حين وصف ناقد معرضهم الأول عام 1874 بسخرية.',traits:['الرسم في الهواء الطلق','ضربات فرشاة سريعة مرئية','عناية بالضوء واللحظة العابرة','موضوعات من الحياة الحديثة والطبيعة']},
 postimpressionism:{line:'اللون حين يصير شعورًا',ar:'ما بعد الانطباعية',orig:'Post-Impressionism',period:'نحو 1886 – 1905',where:'فرنسا وأوروبا',intro:'اسم يجمع فنانين تعلّموا من الانطباعية ثم مضوا في طرق شخصية، فاتجه بعضهم إلى اللون المعبّر وبعضهم إلى البناء والشكل.',traits:['لون معبّر لا وصفي','ضربات فرشاة بارزة','تفضيل التعبير الشخصي على نقل المشهد','تباين كبير بين فنان وآخر']},
 symbolism:{line:'ما لا يُقال يُرسم',ar:'الرمزية',orig:'Symbolism',period:'أواخر القرن 19 – مطلع القرن 20',where:'أوروبا',intro:'اتجه فنانوها إلى التعبير عن الأفكار والمشاعر الداخلية بالرموز والإيحاء بدل وصف الواقع. ويُنظر إلى بعض أعمال مونش بوصفها تمهيدًا للتعبيرية.',traits:['الإيحاء بدل الوصف','الزخرفة والخطوط المنحنية عند بعضهم','موضوعات الحب والموت والقلق','استخدام الذهب والمساحات المسطحة عند كليمت']},
 ukiyoe:{line:'عالمٌ عائمٌ على الورق',ar:'الأوكيو-إي',orig:'Ukiyo-e',period:'القرنان 17 – 19',where:'اليابان',intro:'اسمها يعني «صور العالم العائم». هي مطبوعات خشبية ولوحات يابانية انتشرت في مدينة إيدو، وصوّرت الممثلين والمناظر والحياة المدنية. ووصل أثرها إلى فنانين أوروبيين في القرن 19.',traits:['طباعة بقوالب خشبية، وعدد كبير من النسخ','خطوط واضحة ومساحات لونية مسطحة','تكوينات غير متماثلة وقص جريء','مناظر طبيعية وحياة المدينة']},
 surrealism:{line:'حلمٌ بعينين مفتوحتين',ar:'السريالية',orig:'Surrealism',period:'من عشرينيات القرن 20',where:'فرنسا ثم العالم',intro:'حركة أعلنها الشاعر أندريه بروتون في بيانه عام 1924، وسعت إلى فتح باب الأحلام واللاوعي في الفن، فجمعت بين عناصر واقعية بتركيب غير مألوف.',traits:['صور أحلام وتركيبات غريبة','الجمع بين عناصر واقعية في سياق غير منطقي','اهتمام بالأحلام والتحليل النفسي','أسلوب دقيق التفاصيل عند بعض الفنانين']}
};
const ARTISTS={
 'van-gogh':{ar:'فينسنت فان غوخ',orig:'Vincent van Gogh',born:'1853',died:'1890',place:'زوندرت (هولندا) – أوفير سور واز (فرنسا)',lead:'starry-night',movements:['postimpressionism'],
  bio:'رسّام هولندي بدأ الرسم في سن متأخرة نسبيًا، وترك في عقد واحد تقريبًا أكثر من ألفي عمل بين لوحات ورسوم. عاش في هولندا ثم باريس ثم آرل، ودخل مصحة سان ريمي بعد أزمة نفسية. وكانت رسائله إلى أخيه ثيو مصدرًا أساسيًا لفهم أعماله.',

 vermeer:{ar:'يوهانس فيرمير',orig:'Johannes Vermeer',born:'1632',died:'1675',place:'دلفت (هولندا)',lead:'girl-pearl-earring',movements:['dutch'],

 hokusai:{ar:'كاتسوشيكا هوكوساي',orig:'葛飾北斎 · Katsushika Hokusai',born:'نحو 1760',died:'1849',place:'إيدو (طوكيو اليوم)',lead:'great-wave',movements:['ukiyoe'],
  bio:'فنان ياباني غزير الإنتاج عمل أكثر من سبعين عامًا وغيّر اسمه الفني مرات. أصدر سلسلة «ستة وثلاثين منظرًا لجبل فوجي» وهو في السبعين تقريبًا.',

 leonardo:{ar:'ليوناردو دا فينشي',orig:'Leonardo da Vinci',born:'1452',died:'1519',place:'فينشي (إيطاليا) – أمبواز (فرنسا)',lead:'mona-lisa',movements:['renaissance'],
  bio:'فنان إيطالي من عصر النهضة، عمل في الرسم والنحت والهندسة ودرس التشريح والطبيعة، وترك دفاتر ملاحظات غنية. وصلت إلينا من لوحاته أعمال قليلة.',

 botticelli:{ar:'ساندرو بوتيتشيلي',orig:'Sandro Botticelli',born:'نحو 1445',died:'1510',place:'فلورنسا',lead:'birth-of-venus',movements:['renaissance'],

  style:'خط رشيق وأشكال رقيقة وألوان صافية، يغلب فيها الإيقاع الخطي على الحجم المجسّم.'},
 monet:{ar:'كلود مونيه',orig:'Claude Monet',born:'1840',died:'1926',place:'باريس – جيفرني',lead:'impression-sunrise',movements:['impressionism'],
  bio:'من مؤسسي الانطباعية. رسم المناظر في الهواء الطلق، وكرّر الموضوع الواحد في أوقات مختلفة من النهار ليتابع أثر الضوء. وقضى أواخر حياته في جيفرني حيث رسم حديقته.',
  style:'ضربات فرشاة سريعة وألوان نقية متجاورة، وعناية بالضوء والجو أكثر من الخطوط الدقيقة.'},
 munch:{ar:'إدفارد مونش',orig:'Edvard Munch',born:'1863',died:'1944',place:'لوتن – أوسلو',lead:'the-scream',movements:['symbolism'],

 rembrandt:{ar:'رامبرانت فان راين',orig:'Rembrandt van Rijn',born:'1606',died:'1669',place:'لايدن – أمستردام',lead:'night-watch',movements:['dutch','baroque'],

 dali:{ar:'سلفادور دالي',orig:'Salvador Dalí',born:'1904',died:'1989',place:'فيغيراس (إسبانيا)',lead:null,movements:['surrealism'],
  bio:'رسّام إسباني من أبرز وجوه السريالية. جمع بين دقة أكاديمية في التفاصيل وصور مأخوذة من الأحلام.',

 friedrich:{ar:'كاسبار ديفيد فريدريش',orig:'Caspar David Friedrich',born:'1774',died:'1840',place:'غرايفسفالد – دريسدن',lead:'wanderer',movements:['romanticism'],
  bio:'رسّام ألماني من أهم رسّامي المناظر الرومانسيين. جعل الطبيعة موضوعًا للتأمل الروحي، وكثيرًا ما وضع شخصًا يُرى من الخلف أمام المشهد.',
  style:'مناظر واسعة هادئة بأفق منخفض وضوء ناعم، وحضور صغير للإنسان أمام اتساع الطبيعة.'},
 velazquez:{ar:'دييغو فيلاثكيث',orig:'Diego Velázquez',born:'1599',died:'1660',place:'إشبيلية – مدريد',lead:'las-meninas',movements:['baroque'],
  bio:'رسّام بلاط ملك إسبانيا فيليب الرابع. اشتهر ببورتريهات العائلة المالكة وبمعالجته للهواء والضوء داخل الفراغ.',
  style:'ضربات حرة وفضاء يبدو قابلًا للتنفس، وعناية بنظرات الشخوص وعلاقاتهم داخل الصورة.'},

 story:['دخل فان غوخ المصحة طوعًا في مايو 1889 بعد أزمة نفسية حادة في آرل. أُتيح له أن يرسم هناك، فصارت النافذة والحقول القريبة موضوعه.','كتب إلى أخيه ثيو عن منظر رآه من نافذته قبل شروق الشمس بوقت طويل، لم يكن فيه سوى نجمة الصباح وقد بدت كبيرة جدًا. غير أن اللوحة نفسها لم تُرسم أمام المنظر على الأرجح، بل من الذاكرة، وتذكر مراجع المتحف أن القرية في أسفلها من خياله.','اقتنى متحف الفن الحديث في نيويورك العمل عام 1941 ضمن وصية ليلي ب. بليس.'],
 reading:['تنقسم اللوحة إلى سماء متحركة تشغل الجزء الأكبر، وتلال زرقاء، وقرية هادئة في الأسفل. ويوحّد فان غوخ هذه الأجزاء بضربات فرشاة قصيرة سميكة تتبع اتجاه الحركة، فتبدو السماء كأنها تجري.','تقابل الزرقة العميقة بقعٌ صفراء وبرتقالية للنجوم والقمر، فيلتقي لونان متكاملان في أشد درجاتهما. أما السرو في اليسار فيصعد فوق خط الأفق ويصل الأرض بالسماء.'],
 details:[{t:'شجرة السرو',d:'تلتف داكنة كأنها لهب. يرتبط السرو في تقاليد البحر المتوسط بالمقابر، ويعدّه بعض الدارسين رابطًا بين الأرض والسماء.',r:{x:0,y:14,w:30,h:86}},{t:'القرية وبرج الكنيسة',d:'بيوت صغيرة يتوسطها برج مرتفع. يلاحظ بعض الدارسين أنه أقرب إلى أبراج الكنائس الهولندية منه إلى أبراج بروفانس.',r:{x:28,y:62,w:52,h:34}},{t:'القمر والنجوم',d:'يحيط بكل نجمة وبالهلال هالات من ضربات متحدة المركز. ويُحصي الباحثون في اللوحة أحد عشر نجمًا.',r:{x:60,y:2,w:38,h:36}}],

 intro:'لوحة صغيرة رسمها يوهانس فيرمير نحو عام 1665، يلتفت فيها وجه فتاة نحو المشاهد، وعليها عمامة زرقاء وقرط لؤلؤ.',
 story:['تنتمي اللوحة إلى نوع يسميه الهولنديون «ترونيه»، أي دراسة لوجه أو ملامح لا بورتريه لشخص معروف. ولا يُعرف من كانت النموذج.','بيعت اللوحة في مزاد عام 1881 بمبلغ زهيد نحو غلدنين. ثم أوصى بها مقتنيها إلى متحف مورتسهاوس في لاهاي عام 1902.'],
 reading:['خلفية داكنة مسطحة تبرز الوجه، والضوء يأتي من اليسار فيرسم الخد والشفتين وبريق العين واللؤلؤة. وللعمامة الزرقاء أثر بصري كبير، وقد استُخدم فيها الأزرق المستخرج من حجر اللازورد، وكان من أغلى الأصباغ في ذلك الوقت.'],
 details:[{t:'القرط',d:'بضع لمسات بيضاء تكفي لتوحي بلؤلؤة تعكس الضوء، دون أن يظهر أي خطاف يعلّقها.'},{t:'الشفتان والنظرة',d:'نقطة ضوء صغيرة على الشفة السفلى وأخرى في العين تمنحان الوجه حياة، وتبقيان تعبيره غير محدد.'}],
 interp:[{t:'اقترح الفيزيائي فنسنت إيكه عام 2014 أن القرط قد لا يكون لؤلؤة حقيقية بل قصديرًا مصقولًا، لأن حجمه أكبر من أي لؤلؤة معروفة آنذاك. ولا يزال الرأي موضع نقاش.',a:'رأي فنسنت إيكه، 2014'}],

 intro:'طبعة خشبية أنجزها هوكوساي نحو عام 1831، وهي من سلسلة «ستة وثلاثين منظرًا لجبل فوجي».',
 story:['تُعرف خطأً باسم التسونامي، والأدق أنها موجة بحرية عاتية. تظهر فيها ثلاثة قوارب صيد، وجبل فوجي صغيرًا في البعيد.','وهي طبعة، فلها نسخ كثيرة في متاحف مختلفة وليس لها أصل وحيد. واستُخدم فيها صبغ الأزرق البروسي المستورد، وكان جديدًا في اليابان آنذاك.'],
 reading:['يقوم التكوين على منحنى الموجة الذي يطوّق جبل فوجي الصغير، فيبدو الجبل ثابتًا في قلب الحركة. وتتحول الرغوة إلى أصابع، وتتوازن الخطوط الداكنة مع مساحات لونية مسطحة.'],
 details:[{t:'جبل فوجي',d:'قمته البيضاء تتوسط الفراغ تحت قوس الموجة، فتبدو الموجة أعلى منه.'},{t:'القوارب',d:'ثلاثة قوارب يحني فيها الصيادون أجسادهم ويبدون صغارًا جدًا أمام الموجة.'}],

 intro:'بورتريه رسمه ليوناردو دا فينشي بدءًا من نحو عام 1503 وعاد إليه سنوات، ويحفظه متحف اللوفر في باريس.',
 story:['يُعتقد على نطاق واسع أن النموذج هي ليزا غيرارديني، زوجة التاجر الفلورنسي فرانشيسكو ديل جيوكوندو. ومن هنا اسمها الإيطالي «لا جيوكوندا».','ويُرجّح أن ليوناردو احتفظ بها معه حتى وفاته في فرنسا. وسُرقت من اللوفر عام 1911 واستُردت عام 1913.'],
 reading:['اعتمد ليوناردو أسلوب «السفوماتو»: طبقات رقيقة شفافة تذيب الحدود بين الضوء والظل، فلا يظهر لزاويتي الفم والعينين حدّ قاطع، وهو ما يمنح التعبير غموضه. وخلف الجالسة منظر طبيعي بعيد يضيف عمقًا هوائيًا إلى الصورة.'],
 details:[{t:'اليدان',d:'اليدان مسترخيتان فوق مسند المقعد، ويهتم بهما الدارسون بوصفهما جزءًا من بناء التكوين الهرمي.'},{t:'المنظر البعيد',d:'طرق وجسر وسلاسل جبلية زرقاء تتلاشى في الضباب، وتتفاوت خطوط الأفق على جانبي الرأس.'}],

 intro:'لوحة ضخمة لبوتيتشيلي تصوّر الإلهة فينوس وهي تصل إلى الشاطئ على صدفة، من أشهر أعمال عصر النهضة الإيطالية.',

<div class="dsec"><h2>مقدمة تاريخية</h2><div class="read"><p>${m.intro}</p></div></div>
<div class="dsec"><h2>ما يميّزها</h2><ul class="traits">${m.traits.map(t=>`<li>${t}</li>`).join('')}</ul></div>
<div class="dsec"><h2>فنانون مرتبطون</h2><div class="alist">${as.map(x=>`<a ${go_('artist/'+x)}><b class="ar" style="font-size:20px">${A(x).ar}</b><span class="cap">${A(x).born} – ${A(x).died}</span></a>`).join('')}</div></div>
<div class="dsec" style="border:0"><h2>لوحات من هذه المدرسة</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${ws.map(w=>wcard(w)).join('')}</div></div></div>`}
/* ---------- shell ---------- */
function footer(){return `<footer class="ftr"><div class="wrap ftr-g"><div><div class="logo" style="margin-bottom:12px">${sym(34,5)}${wordmark}</div><p class="muted" style="max-width:36ch">كل لوحة خيط في حكاية الفن.</p></div>
<div><b>تنقّل</b><ul style="margin-top:8px"><li><a ${go_('')}>الرئيسية</a></li><li><a ${go_('artworks')}>اللوحات</a></li><li><a ${go_('artists')}>الفنانون</a></li><li><a ${go_('movements')}>المدارس الفنية</a></li></ul></div>
<div><b>المصادر والاعتمادات</b><p class="cap" style="margin-top:8px">صور اللوحات من ويكيميديا كومنز، وهي أعمال في الملك العام وتُعرض بألوانها الأصلية. البيانات من مراجع المتاحف والمقالات المنشورة، وتُذكر في صفحة كل لوحة. هذا نموذج أولي، والمحتوى مختصر وقيد المراجعة التحريرية.</p></div></div></footer>`}
function render(){
 const [t,p]=cur.split('/'),v=$('#view');
 v.innerHTML=({'':home,artworks:collection,artwork:()=>artwork(p),artists,artist:()=>artist(p),movements,movement:()=>movement(p)}[t]||notFound)();
 $('#view').insertAdjacentHTML('beforeend',footer());
 const tp=topNav();$$('[data-nav]').forEach(a=>{a.toggleAttribute('aria-current',a.dataset.nav===tp);if(a.dataset.nav===tp)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 closeAll();fixImgs();v.style.animation='none';void v.offsetWidth;v.style.animation='';
 if(t==='artwork')setupDetail();else $('#rail')?.remove();
 const h=$('#h1');if(h)h.focus({preventScroll:true});
}
function fixImgs(){$$('img:not(.ld)').forEach(i=>{if(i.complete)i.classList.add('ld')});setTimeout(()=>$$('img:not(.ld)').forEach(i=>i.classList.add('ld')),3000)}
/* detail: Long Thread in the margin + subnav */
function drawRail(){const d=$('#detail'),r=$('#rail');if(!d||!r||getComputedStyle(r).display==='none')return;
 const dr=d.getBoundingClientRect(),pts=$$('[data-th]',d).map(e=>{const b=e.getBoundingClientRect();return e.id==='plate'?b.bottom-dr.top-16:b.top-dr.top+22});
 const last=$('[data-th-end]',d);if(last){pts.push(last.getBoundingClientRect().top-dr.top+60)}
 if(pts.length<2)return;const x=24,H=d.offsetHeight;r.setAttribute('viewBox',`0 0 48 ${H}`);r.setAttribute('height',H);
 let p=`M${x},${pts[0]}`;for(let i=1;i<pts.length;i++){const y0=pts[i-1],y1=pts[i],ym=(y0+y1)/2,s=i%2?10:-10;p+=` C${x+s},${y0+(ym-y0)*.5} ${x+s},${ym+(y1-ym)*.5} ${x},${y1}`}
 r.innerHTML=`<path d="${p}"/>${pts.map(y=>`<circle cx="${x}" cy="${y}" r="4"/>`).join('')}`}
let rafL=0;function onScroll(){if(rafL)return;rafL=requestAnimationFrame(()=>{rafL=0;const subs=$$('.subnav a');if(!subs.length)return;let on=null;subs.forEach(a=>{const s=$('#'+a.dataset.scroll);if(s&&s.getBoundingClientRect().top<180)on=a});subs.forEach(a=>a.classList.toggle('on',a===on))})}
function setupDetail(){drawRail();[200,800,1800].forEach(t=>setTimeout(drawRail,t));onScroll()}
/* overlays */
function closeAll(){$('#drawer').classList.remove('open');$('#sov').classList.remove('open');$('#lb').classList.remove('open');document.body.style.overflow=''}
function openSearch(){$('#sov').classList.add('open');document.body.style.overflow='hidden';const i=$('#sq');i.value='';sres('');setTimeout(()=>i.focus(),30)}
function sres(q){const n=norm(q);const r=n?WORKS.filter(w=>n.split(' ').every(t=>norm([w.titleAr,w.orig,A(w.artist).ar,A(w.artist).orig,M(w.movement).ar].join(' ')).includes(t))).slice(0,8):[];
 $('#sr').innerHTML=!n?`<p class="muted">اكتب عنوان لوحة أو اسم فنان.</p>`:r.length?r.map(w=>`<a ${go_('artwork/'+w.id)}>${w.img?`<img src="img/${w.img}.jpg" alt="" width="44" height="44">`:'<span style="width:44px;height:44px;background:var(--surface)"></span>'}<span><b class="ar" style="font-size:19px">${w.titleAr}</b><br><span class="cap">${A(w.artist).ar} · ${w.date}</span></span></a>`).join('')+`<a ${go_('artworks')} data-q="${esc(q)}" class="tl" style="border:0">عرض كل النتائج في المجموعة</a>`:`<p class="muted">لا نتائج لهذا البحث.</p>`}
/* events */
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-back],[data-hero],[data-rail],[data-clr],[data-reset],[data-more],[data-ftoggle],[data-zoom],[data-scroll],#openS,#openM,#closeM,#closeS,#lb');if(!t)return;
 if(t.dataset.go!==undefined){e.preventDefault();if(t.dataset.q!==undefined){F.q=t.dataset.q}go(t.dataset.go)}
 else if(t.dataset.back){goBack(t.dataset.back)}
 else if(t.dataset.rail){const el=$('#rsc');el.scrollBy({left:-(+t.dataset.rail)*el.clientWidth*.8,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
 else if(t.dataset.hero){hi=+t.dataset.hero;$('#heroIn').innerHTML=heroHTML()}
 else if(t.dataset.clr){const k=t.dataset.clr;F[k==='q'?'q':k]='';if(k==='q')$('#fq').value='';['fm','fa','fp'].forEach((i,n)=>{});F.shown=6;syncFilters();refreshRes()}
 else if(t.dataset.reset!==undefined){Object.assign(F,{q:'',mov:'',art:'',per:'',sort:'date-asc',shown:6});syncFilters();refreshRes()}
 else if(t.dataset.more!==undefined){F.shown+=6;refreshRes()}
 else if(t.dataset.ftoggle!==undefined){F.open=!F.open;$('#flt').classList.toggle('collapsed',!F.open);t.setAttribute('aria-expanded',F.open)}
 else if(t.dataset.zoom){$('#lbi').src='img/'+t.dataset.zoom+'.jpg';$('#lb').classList.add('open');document.body.style.overflow='hidden'}
 else if(t.dataset.scroll){e.preventDefault();$('#'+t.dataset.scroll).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
 else if(t.id==='openS')openSearch();else if(t.id==='closeS'){closeAll()}
 else if(t.id==='openM'){$('#drawer').classList.add('open');document.body.style.overflow='hidden'}else if(t.id==='closeM')closeAll();
 else if(t.id==='lb')closeAll();
});
function syncFilters(){const f=$('#fq');if(!f)return;f.value=F.q;$('#fm').value=F.mov;$('#fa').value=F.art;$('#fp').value=F.per;$('#fs').value=F.sort}
document.addEventListener('input',e=>{if(e.target.id==='fq'){F.q=e.target.value;F.shown=6;refreshRes()}if(e.target.id==='sq')sres(e.target.value)});
document.addEventListener('change',e=>{const m={fm:'mov',fa:'art',fp:'per',fs:'sort'}[e.target.id];if(m){F[m]=e.target.value;F.shown=6;refreshRes()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if(e.key==='Enter'&&e.target.id==='sq'){F.q=e.target.value;go('artworks')}});
addEventListener('resize',()=>{drawRail()});addEventListener('scroll',onScroll,{passive:true});
$('#logoA').innerHTML=sym(36,5)+wordmark;$('#openS').insertAdjacentHTML('afterbegin',ico.search);$('#openM').innerHTML=ico.menu;$('#closeM').innerHTML=ico.x;$('#closeS').innerHTML=ico.x;$('#lbx').innerHTML=ico.x;
render();applySky();
</script>

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WASHIJ splash B – still night</title>
<style>
@font-face{font-family:Amiri;font-weight:700;src:url(../app/assets/fonts/Amiri-Bold.ttf)}
@font-face{font-family:'Cormorant Garamond';font-weight:300 700;src:url("../app/assets/fonts/CormorantGaramond%5Bwght%5D.ttf")}
:root{--midnight:#081B33;--deep:#0E2542;--raised:#14305A;--ivory:#F6F2E9;--yellow:#F2C94C;--mist:#9FB3CF;--sky:#7DA3D8}
html,body{margin:0;height:100%;background:var(--midnight);overflow:hidden}
.sky{position:fixed;inset:0;background:linear-gradient(180deg,#081B33 0,#0E2542 70%,#14305A 100%)}
.layer{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:var(--ivory);animation:tw var(--d) ease-in-out var(--s) infinite alternate}
.star.y{background:var(--yellow);box-shadow:0 0 12px 2px rgba(242,201,76,.45)}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh}
.wave{position:absolute;left:-10%;width:120%;fill:none;stroke-width:1.4;opacity:.5;animation:sway 14s ease-in-out infinite alternate}
.logo{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:20px;text-align:center}
svg.sym{width:min(34vmin,200px);overflow:visible;opacity:0;animation:fade 1.2s .4s forwards}
.fr,.t{fill:none;stroke-width:3.2}.fr{stroke:var(--ivory);stroke-linejoin:miter}
.t{stroke:var(--yellow);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s 1.2s cubic-bezier(.5,0,.2,1) forwards}
.ar{font:700 clamp(34px,8vmin,56px)/1 Amiri,'Scheherazade New',serif;color:var(--ivory);opacity:0;animation:fade 1s 2.4s forwards}
.ar i{color:var(--yellow);font-style:normal}
.en{font:500 clamp(11px,2vmin,14px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.32em;color:var(--mist);opacity:0;animation:fade 1s 2.8s forwards;direction:ltr}
@keyframes tw{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
@keyframes sway{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
@keyframes fade{to{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.star{opacity:.8}svg.sym,.ar,.en{opacity:1}.t{stroke-dashoffset:0}}
</style></head><body>
<div class="sky" aria-hidden="true"><div class="layer" id="stars"></div>
<svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none"><path class="wave" style="stroke:#7DA3D8;bottom:0" d="M0,200 C200,150 400,250 600,190 S1000,140 1200,200" /><path class="wave" style="stroke:#1E3A8A;animation-delay:-4s;opacity:.9" d="M0,235 C250,190 450,280 700,225 S1050,190 1200,240"/><path d="M0,270 C300,240 600,290 1200,255 V300 H0Z" fill="#081B33"/></svg></div>
<main class="logo" role="img" aria-label="وشيج">
<svg class="sym" viewBox="0 0 120 120"><path class="fr" d="M33,73.13 V15 H87 V105 H33 V84.87"/><path class="t" pathLength="1" d="M6,98 L33,79.00 L80.60,45.50 M93.40,36.50 L114,22"/></svg>
<div class="ar" lang="ar">و<i>َ</i>شيج</div><div class="en">WASHIJ</div></main>
<script>
const s=document.getElementById('stars');
for(let i=0;i<110;i++){const e=document.createElement('i');e.className='star'+(i%9==0?' y':'');
 const z=i%9==0?3+Math.random()*3:1+Math.random()*2;
 e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*72}%;width:${z}px;height:${z}px;--d:${1.5+Math.random()*3}s;--s:${-Math.random()*4}s`;s.appendChild(e)}
</script></body></html>
